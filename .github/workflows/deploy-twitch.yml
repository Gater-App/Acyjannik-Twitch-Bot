name: Manual Twitch deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only host preflight or an approved Twitch release
        type: choice
        options:
          - preflight
          - deploy
        default: preflight
        required: true
      confirm_release_gate:
        description: Confirm the separate release gates are closed and this exact main commit is approved
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: production-twitch
  cancel-in-progress: false

jobs:
  guard:
    name: Validate manual dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the default branch and explicit deployment confirmation
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM_RELEASE_GATE: ${{ inputs.confirm_release_gate }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$REPOSITORY" == "Gater-App/Acyjannik-Twitch-Bot" ]]
          [[ "$REF" == "refs/heads/main" ]]
          [[ "$OPERATION" == "preflight" || "$OPERATION" == "deploy" ]]
          if [[ "$OPERATION" == "deploy" && "$CONFIRM_RELEASE_GATE" != "true" ]]; then
            echo "Deployment requires the explicit release-gate confirmation." >&2
            exit 1
          fi

  build:
    name: Test and package immutable Twitch release
    needs: guard
    if: ${{ inputs.operation == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the manually selected main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run project checks and unit tests
        run: npm run check

      - name: Run browser tests
        run: npm run test:browser

      - name: Enforce unchanged production schema 32
        run: node scripts/create-deployment-metadata.mjs --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/deployment-metadata.json"

      - name: Build and verify the exact release artifact
        run: |
          set -euo pipefail
          npm run build
          package_dir="$RUNNER_TEMP/acy-twitch-release"
          mkdir -p "$package_dir/scripts"
          cp -a dist "$package_dir/dist"
          cp package.json package-lock.json "$package_dir/"
          cp scripts/backup.mjs scripts/restore.mjs scripts/verify-release-manifest.mjs "$package_dir/scripts/"
          cp "$RUNNER_TEMP/deployment-metadata.json" "$package_dir/deployment-metadata.json"
          node scripts/create-release-manifest.mjs \
            --artifact "$package_dir/dist" \
            --source-commit "$GITHUB_SHA" \
            --output "$package_dir/release-manifest.json"
          node scripts/verify-release-manifest.mjs \
            --artifact "$package_dir/dist" \
            --manifest "$package_dir/release-manifest.json" \
            --source-commit "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$package_dir" \
            dist release-manifest.json deployment-metadata.json package.json package-lock.json scripts
          (cd "$RUNNER_TEMP" && sha256sum release.tar.gz > release.tar.gz.sha256)
          git diff --check HEAD^ HEAD

      - name: Upload the immutable release bundle for this run only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twitch-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Twitch-only Oracle preflight or deployment
    needs: [guard, build]
    if: >-
      ${{
        always() &&
        needs.guard.result == 'success' &&
        (inputs.operation == 'preflight' || (inputs.operation == 'deploy' && needs.build.result == 'success'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production-twitch
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download this run's exact release bundle
        if: ${{ inputs.operation == 'deploy' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: twitch-release-${{ github.sha }}
          path: ${{ runner.temp }}/acy-release

      - name: Validate release approval and configure pinned SSH trust
        env:
          OPERATION: ${{ inputs.operation }}
          GITHUB_SHA: ${{ github.sha }}
          APPROVED_COMMIT: ${{ vars.ACY_TWITCH_APPROVED_COMMIT }}
          SSH_HOST: ${{ vars.ORACLE_TWITCH_SSH_HOST }}
          SSH_PORT: ${{ vars.ORACLE_TWITCH_SSH_PORT }}
          SSH_USER: ${{ vars.ORACLE_TWITCH_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_TWITCH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_TWITCH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ || "$SSH_HOST" == *..* ]]; then
            echo "ORACLE_TWITCH_SSH_HOST must be a verified DNS name or IPv4 address." >&2
            exit 1
          fi
          if [[ ! "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "ORACLE_TWITCH_SSH_PORT must be an integer from 1 to 65535." >&2
            exit 1
          fi
          port_number=$((10#$SSH_PORT))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "ORACLE_TWITCH_SSH_PORT must be an integer from 1 to 65535." >&2
            exit 1
          fi
          [[ "$SSH_USER" == "ubuntu" ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          if [[ "$OPERATION" == "deploy" ]]; then
            [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ && "$APPROVED_COMMIT" == "$GITHUB_SHA" ]]
          fi

          key_file="$RUNNER_TEMP/acy-twitch-deploy-key"
          known_hosts_file="$RUNNER_TEMP/acy-twitch-known-hosts"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh-keygen -y -P '' -f "$key_file" > /dev/null
          lookup_host="$SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then lookup_host="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup_host" -f "$known_hosts_file" > /dev/null

          printf 'SSH key and pinned known_hosts entry validated for configured endpoint.\n'

      - name: Run read-only forced-command preflight
        env:
          SSH_HOST: ${{ vars.ORACLE_TWITCH_SSH_HOST }}
          SSH_PORT: ${{ vars.ORACLE_TWITCH_SSH_PORT }}
          SSH_USER: ${{ vars.ORACLE_TWITCH_SSH_USER }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/acy-twitch-deploy-key"
          known_hosts_file="$RUNNER_TEMP/acy-twitch-known-hosts"
          ssh_options=(
            -p "$SSH_PORT"
            -i "$key_file"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=12
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" preflight

      - name: Recheck artifact digest and deploy only the Twitch process
        if: ${{ inputs.operation == 'deploy' }}
        env:
          SSH_HOST: ${{ vars.ORACLE_TWITCH_SSH_HOST }}
          SSH_PORT: ${{ vars.ORACLE_TWITCH_SSH_PORT }}
          SSH_USER: ${{ vars.ORACLE_TWITCH_SSH_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/acy-release"
          sha256sum -c release.tar.gz.sha256
          artifact_sha="$(cut -d ' ' -f 1 release.tar.gz.sha256)"
          [[ "$artifact_sha" =~ ^[0-9a-f]{64}$ ]]
          key_file="$RUNNER_TEMP/acy-twitch-deploy-key"
          known_hosts_file="$RUNNER_TEMP/acy-twitch-known-hosts"
          ssh_options=(
            -p "$SSH_PORT"
            -i "$key_file"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=12
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" deploy "$GITHUB_SHA" "$artifact_sha" < release.tar.gz
